# Run on a Java/Docker host, NOT on Vercel.
# This uses the independent GPL-3.0 project by kl3pt0gr4ph.
services:
  extractor:
    image: mrtumble/opentube-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENTUBE_NEWPIPE_LANGUAGE: en
      OPENTUBE_NEWPIPE_COUNTRY: ID
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    mem_limit: 768m
# Publish the private local port securely using your own HTTPS reverse proxy.
