name: NewPipe Web CI
on:
  push:
    paths:
      - "newpipe-web/**"
      - "vercel.json"
      - ".github/workflows/newpipe-web-ci.yml"
  pull_request:
    paths:
      - "newpipe-web/**"
      - "vercel.json"
      - ".github/workflows/newpipe-web-ci.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newpipe-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run test:lyrics
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile ytdlp/server.py
